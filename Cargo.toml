[workspace]
members = [
    "subsecond-async",
    "subsecond-async-macros",
]
resolver = "3"

[workspace.package]
authors = ["Tuetuopay <tuetuopay@me.com>"]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
pin-project = "1"
quote = "1"
subsecond = "0.7"
syn = "3"

subsecond-async-macros.path = "./subsecond-async-macros"

# For examples
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
dioxus-devtools = "0.7"
